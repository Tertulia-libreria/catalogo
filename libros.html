  position: absolute;
  left: 50%;
  top: 50%;

  height: 6px;

  transform: translate(-50%, -50%);
  clip-path: polygon(
    50% 0%, 61% 35%, 98% 35%, 
    68% 57%, 79% 91%, 
    50% 70%, 21% 91%, 
    32% 57%, 2% 35%, 39% 35%
  );
  animation: starExplosion .9s ease-out forwards;
}
@keyframes starExplosion {
  0% {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }
  30% {
    transform: translate(-50%, -50%) scale(1.2);
    opacity: 1;
  }
  100% {

               scale(0) rotate(360deg);

  }
}

<script>
/* ================= CONFIG ================= */
var numero = "524751070540";
var libros = [];
var favs = [];
var librosPorPagina = 40;
var paginaActual = 1;
var librosFiltrados = [];
var todosLibros = [];
var viendoFavs = false;
var productosPendientes = [];
var renderizando = false;
var catPorCode = {};      // code → libro (datos del catálogo)
var cart = {};            // code → cantidad en el carrito
var MAX_LIBROS_CARRITO = 15;   // libros distintos por pedido (para que el mensaje de WhatsApp quepa)
var UMBRAL_DOMICILIO = 200;    // domicilio gratis en compras superiores a este monto
function normalizar(texto){
  return texto
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}
function guardarEstadoEnURL(){
  const params = new URLSearchParams();

  if (viendoFavs) {
    params.set("favoritos", "1");
  }

  const categoria = document.getElementById("categoria").value;
  if (categoria) {
    params.set("categoria", categoria);
  }

  params.set("pagina", paginaActual);

  const nuevaURL = "?" + params.toString();

  history.pushState(
    { 
      pagina: paginaActual,
      scroll: window.scrollY
    },
    "",
    nuevaURL
  );
}

function obtenerEstadoDesdeURL(){

/* =====================================================
   CARRITO DE COMPRAS
   - Se guarda en este navegador (localStorage), por código de libro.
   - La cantidad nunca pasa de las piezas disponibles (matriz + sucursal).
   - El pedido se envía por WhatsApp para confirmar disponibilidad y envío.
   ===================================================== */
const CARRITO_KEY = "carritoTertulia";
const SVG_CARRITO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 7H6.2"/></svg>';

function esc(t){
  return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function stockDe(L){
  return Math.max(0, (Number(L.existencia) || 0)) + Math.max(0, (Number(L.existencia_sucursal) || 0));
}
function precioDe(L){ return Number(L.precio) || 0; }
function dinero(n){
  n = Number(n) || 0;
  return "$" + n.toLocaleString("es-MX", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
}
function reducirMovimiento(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* ---------- guardado ---------- */
function cargarCarrito(){
  let quitados = 0;
  cart = {};
  try {
    const raw = JSON.parse(localStorage.getItem(CARRITO_KEY) || "{}");
    Object.keys(raw).forEach(code => {
      const info = catPorCode[code];
      const q = parseInt(raw[code], 10);
      if (!(q > 0)) return;
      const st = info ? stockDe(info) : 0;
      if (st > 0) cart[code] = Math.min(q, st); else quitados++;
    });
  } catch (e) { cart = {}; }
  guardarCarrito();
  if (quitados) setTimeout(() => mostrarToast("Quitamos de tu carrito " + quitados + (quitados === 1 ? " libro que ya no está disponible" : " libros que ya no están disponibles")), 800);
}
function guardarCarrito(){
  try { localStorage.setItem(CARRITO_KEY, JSON.stringify(cart)); } catch (e) {}
}
function codigosCarrito(){ return Object.keys(cart); }
function totalPiezas(){ return codigosCarrito().reduce((s, c) => s + cart[c], 0); }
function totalPesos(){ return codigosCarrito().reduce((s, c) => s + precioDe(catPorCode[c]) * cart[c], 0); }

/* ---------- botón de cada ficha ---------- */
function pintarBoton(btn, L){
  const st = stockDe(L);
  const q = cart[String(L.code)] || 0;
  const poner = (icono, largo, corto, deshabilitado) => {
    btn.innerHTML = (icono ? SVG_CARRITO : "") + '<span class="lbl-largo">' + largo + '</span><span class="lbl-corto">' + corto + '</span>';
    btn.disabled = deshabilitado;
  };
  if (st <= 0)       poner(false, "No disponible", "No disponible", true);
  else if (q >= st)  poner(false, "✔ Ya en tu carrito", "✔ En carrito", true);
  else               poner(true, "Agregar al carrito" + (q ? " (" + q + ")" : ""), "Agregar" + (q ? " (" + q + ")" : ""), false);
}
function actualizarBotones(){
  todosLibros.forEach(p => {
    const L = catPorCode[p.dataset.code];
    const btn = p.querySelector(".btn-carrito");
    if (L && btn) pintarBoton(btn, L);
  });
}

/* ---------- agregar ---------- */
function agregarAlCarrito(btn){
  const prod = btn.closest(".producto");
  const code = prod.dataset.code;
  const L = catPorCode[code];
  if (!L) return;
  const st = stockDe(L), q = cart[code] || 0;
  if (st <= 0) return;
  if (q >= st){ mostrarToast("Ya tienes todas las piezas disponibles de este libro"); return; }
  if (!q && codigosCarrito().length >= MAX_LIBROS_CARRITO){
    mostrarToast("Máximo " + MAX_LIBROS_CARRITO + " libros distintos por pedido. Envía este y haz otro después 😊");
    return;
  }
  prepararAudio();
  cart[code] = q + 1;
  guardarCarrito();
  actualizarBotones();
  btn.classList.add("agregado");
  setTimeout(() => btn.classList.remove("agregado"), 900);
  volarAlCarrito(prod.querySelector("img"), () => {
    pintarInsignia(true);
    sonidoPop();
    if (carritoAbierto()) renderCarrito();
  });
}

function cambiarCantidad(code, delta){
  const L = catPorCode[code];
  if (!L || !cart[code]) return;
  const nueva = cart[code] + delta;
  if (nueva <= 0){ quitarDelCarrito(code); return; }
  if (nueva > stockDe(L)){ mostrarToast("No hay más piezas disponibles de este libro"); return; }
  cart[code] = nueva;
  guardarCarrito(); actualizarBotones(); pintarInsignia(); renderCarrito();
}
function quitarDelCarrito(code){
  delete cart[code];
  guardarCarrito(); actualizarBotones(); pintarInsignia(); renderCarrito();
}
function vaciarCarrito(){
  if (!codigosCarrito().length) return;
  if (!confirm("¿Vaciar todo el carrito?")) return;
  cart = {};
  guardarCarrito(); actualizarBotones(); pintarInsignia(); renderCarrito();
}

/* ---------- insignia del carrito (barra superior) ---------- */

  b.style.display = n > 0 ? "block" : "none";

  if (saltar && !reducirMovimiento()){

  }

/* ---------- animación: la portada se encoge y vuela al carrito ---------- */
function volarAlCarrito(imgEl, alLlegar){
  const destino = document.getElementById("carritoBtn");
  const a = imgEl ? imgEl.getBoundingClientRect() : null;
  if (reducirMovimiento() || !a || !a.width || !a.height || !destino || !destino.animate){ alLlegar(); return; }
  const b = destino.getBoundingClientRect();
  const vuelo = document.createElement("img");
  vuelo.className = "vuelo";
  vuelo.src = imgEl.currentSrc || imgEl.src;
  vuelo.style.cssText = "left:" + a.left + "px;top:" + a.top + "px;width:" + a.width + "px;height:" + a.height + "px;";
  document.body.appendChild(vuelo);
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  let terminado = false;
  const terminar = () => { if (terminado) return; terminado = true; vuelo.remove(); alLlegar(); };
  const anim = vuelo.animate([
    { transform: "translate(0,0) scale(1)", opacity: 1 },
    { transform: "translate(" + (dx * 0.45) + "px," + (dy * 0.45 - 70) + "px) scale(.45)", opacity: .95, offset: .45 },
    { transform: "translate(" + dx + "px," + dy + "px) scale(.08)", opacity: .5 }
  ], { duration: 800, easing: "cubic-bezier(.45,.05,.55,.95)" });
  anim.onfinish = terminar;
  setTimeout(terminar, 1200);
}

/* ---------- sonido (generado por el navegador, sin archivos) ---------- */
let audioCtx = null;
function sonidoActivo(){ try { return localStorage.getItem("carritoSonido") !== "0"; } catch (e) { return true; } }
function pintarSonido(){ document.getElementById("sonidoBtn").textContent = sonidoActivo() ? "🔊" : "🔇"; }
function alternarSonido(){
  try { localStorage.setItem("carritoSonido", sonidoActivo() ? "0" : "1"); } catch (e) {}
  pintarSonido();
  if (sonidoActivo()){ prepararAudio(); sonidoPop(); }
}
function prepararAudio(){
  if (!sonidoActivo()) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function sonidoPop(){
  if (!sonidoActivo() || !audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(620, t);
    o.frequency.exponentialRampToValueAtTime(980, t + 0.08);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.19);
  } catch (e) {}
}

let toastTimer = null;
function mostrarToast(texto){
  const t = document.getElementById("toast");

function renderCarrito(){
  const lista = document.getElementById("carritoLista");
  const codes = codigosCarrito();
  lista.innerHTML = "";

  if (!codes.length){
    lista.innerHTML = '<div class="car-vacio">🛒<br><br>Tu carrito está vacío.<br>Toca «Agregar al carrito» en los libros que te gusten.</div>';
  } else {
    codes.forEach(code => {
      const L = catPorCode[code];
      const q = cart[code], st = stockDe(L), p = precioDe(L);
      const item = document.createElement("div");
      item.className = "car-item";
      item.innerHTML =
        '<img src="' + esc(L.imagen) + '" alt="">' +
        '<div class="car-info">' +
          '<div class="car-titulo">' + esc(L.titulo) + '</div>' +
          '<div class="car-precio">' + dinero(p) + ' c/u</div>' +
          '<div class="car-ctrl">' +
            '<button class="qty" type="button" data-act="menos" data-code="' + esc(code) + '" aria-label="Quitar una pieza">−</button>' +
            '<span class="cant">' + q + '</span>' +
            '<button class="qty" type="button" data-act="mas" data-code="' + esc(code) + '" aria-label="Agregar una pieza"' + (q >= st ? " disabled" : "") + '>+</button>' +
            '<span class="car-sub">' + dinero(p * q) + '</span>' +
          '</div>' +
          (q >= st ? '<div class="car-aviso">Es lo que hay disponible' + (st <= 3 ? " (últimas piezas)" : "") + '</div>' : "") +
        '</div>' +
        '<button class="car-quitar" type="button" data-act="quitar" data-code="' + esc(code) + '" aria-label="Quitar este libro">✕</button>';
      lista.appendChild(item);
    });
  }

  const total = totalPesos(), piezas = totalPiezas();
  document.getElementById("carritoTotal").textContent = dinero(total);
  document.getElementById("carritoPiezas").textContent = piezas ? "(" + piezas + (piezas === 1 ? " pieza)" : " piezas)") : "";
  const hint = document.getElementById("carritoHint");
  if (!piezas){ hint.textContent = ""; hint.className = "car-hint"; }
  else if (total > UMBRAL_DOMICILIO){ hint.textContent = "🎉 Ya tienes servicio a domicilio gratis"; hint.className = "car-hint ok"; }
  else { hint.textContent = "Te faltan " + dinero(UMBRAL_DOMICILIO - total + 0.01).replace(/\.01$/, "") + " para servicio a domicilio gratis"; hint.className = "car-hint"; }
  document.getElementById("carritoPedido").disabled = !piezas;
}

document.getElementById("carritoLista").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const code = b.dataset.code;
  if (b.dataset.act === "mas") cambiarCantidad(code, 1);
  else if (b.dataset.act === "menos") cambiarCantidad(code, -1);
  else if (b.dataset.act === "quitar") quitarDelCarrito(code);
});

/* ---------- pedido por WhatsApp ---------- */
function enviarPedido(){
  const codes = codigosCarrito();
  if (!codes.length) return;
  let total = 0;
  const lineas = codes.map(code => {
    const L = catPorCode[code], q = cart[code], p = precioDe(L);
    total += p * q;
    return "• " + L.titulo + (q > 1 ? " (x" + q + ") – " + dinero(p) + " c/u = " + dinero(p * q) : " – " + dinero(p));
  });
  const msg =
    "Hola 👋\n\nMe gustaría hacer este pedido:\n\n" +
    lineas.join("\n") +
    "\n\nTotal: " + dinero(total) + " MXN (sin envío)\n\n" +
    "¿Me confirmas disponibilidad y costo de envío? 📚✨\nGracias.";
  window.open("https://wa.me/" + numero + "?text=" + encodeURIComponent(msg), "_blank");
}

/* ---------- lista de deseos → carrito ---------- */
function agregarDeseosAlCarrito(){
  const prods = todosLibros.filter(p => favs.includes(p.querySelector(".titulo").innerText));
  let agregados = 0, agotados = 0, yaEstaban = 0, sinLugar = 0;
  prods.forEach(p => {
    const code = p.dataset.code, L = catPorCode[code];
    if (!L || stockDe(L) <= 0){ agotados++; return; }
    if (cart[code]){ yaEstaban++; return; }
    if (codigosCarrito().length >= MAX_LIBROS_CARRITO){ sinLugar++; return; }
    cart[code] = 1; agregados++;
  });
  guardarCarrito(); actualizarBotones(); pintarInsignia(agregados > 0);
  const partes = [];
  if (agregados) partes.push(agregados + (agregados === 1 ? " libro agregado" : " libros agregados"));
  if (yaEstaban) partes.push(yaEstaban + " ya estaban en el carrito");
  if (agotados) partes.push(agotados + (agotados === 1 ? " agotado" : " agotados"));
  if (sinLugar) partes.push(sinLugar + " no cupieron (máximo " + MAX_LIBROS_CARRITO + " por pedido)");
  if (agregados){ sonidoPop(); abrirCarrito(); }
  if (partes.length) mostrarToast(partes.join(" · "));
}

/* =====================================
   CONTADOR SOCIAL DINÁMICO INTELIGENTE v3
   Más dinámico, realista y sin ceros
   México siempre líder
   ===================================== */

const paisesAmerica = [
  { nombre: "México", codigo: "mx" },
  { nombre: "Guatemala", codigo: "gt" },
  { nombre: "Estados Unidos", codigo: "us" },
  { nombre: "Colombia", codigo: "co" },
  { nombre: "Argentina", codigo: "ar" },
  { nombre: "Chile", codigo: "cl" },
  { nombre: "Perú", codigo: "pe" },
  { nombre: "El Salvador", codigo: "sv" }
];

/* -------- Nivel según hora -------- */

function nivelSegunHora() {
  const hora = new Date().getHours();

  if (hora >= 6 && hora < 12) {
    return { maxPaises: 2, maxVisitas: 3 };
  }
  if (hora >= 12 && hora < 18) {
    return { maxPaises: 3, maxVisitas: 6 };
  }
  if (hora >= 18 && hora < 23) {
    return { maxPaises: 4, maxVisitas: 12 };
  }

  return { maxPaises: 1, maxVisitas: 2 };
}

/* -------- Generar estado inicial -------- */

function generarEstadoInicial() {
  const hoy = new Date().toDateString();
  const nivel = nivelSegunHora();

  let cantidadPaises = Math.floor(Math.random() * nivel.maxPaises) + 1;

  let seleccionados = paisesAmerica
    .filter(p => p.nombre !== "México")
    .sort(() => 0.5 - Math.random())
    .slice(0, cantidadPaises - 1);

  seleccionados.unshift(paisesAmerica[0]);

  const mexicoBase = Math.floor(Math.random() * nivel.maxVisitas) + 1;

  const data = {
    fecha: hoy,
    paises: seleccionados.map(p => ({
      ...p,
      visitas: p.nombre === "México"
        ? Math.max(1, mexicoBase)
        : Math.max(1, Math.floor(Math.random() * mexicoBase))
    }))
  };

  localStorage.setItem("contadorSocial", JSON.stringify(data));
  return data;
}

/* -------- Obtener estado -------- */

function obtenerEstado() {
  const hoy = new Date().toDateString();
  let data = JSON.parse(localStorage.getItem("contadorSocial"));

  if (!data || data.fecha !== hoy) {
    return generarEstadoInicial();
  }

  // 🔥 LIMPIEZA ANTICEROS
  data.paises = data.paises.filter(p => p.visitas > 0);

  data.paises.forEach(p => {
    if (p.visitas < 1) p.visitas = 1;
  });

  // Garantizar México
  if (!data.paises.find(p => p.nombre === "México")) {
    data.paises.unshift({
      nombre: "México",
      codigo: "mx",
      visitas: 1
    });
  }

  localStorage.setItem("contadorSocial", JSON.stringify(data));
  return data;
}

/* -------- Actualizar cada 3 minutos -------- */

function actualizarEstado() {

  let data = obtenerEstado();
  const nivel = nivelSegunHora();

  // Garantizar México
  if (!data.paises.find(p => p.nombre === "México")) {
    data.paises.unshift({
      nombre: "México",
      codigo: "mx",
      visitas: 1
    });
  }

  const mexicoObj = data.paises.find(p => p.nombre === "México");

  // Ajustar visitas
  data.paises.forEach(p => {

    let cambio = Math.floor(Math.random() * 3) - 1; // -1,0,+1
    p.visitas += cambio;

    // Nunca 0
    if (p.visitas < 1) p.visitas = 1;

    if (p.nombre === "México") {

      // México sube un poco más dinámico
      p.visitas += Math.floor(Math.random() * 2);

      if (p.visitas > nivel.maxVisitas)
        p.visitas = nivel.maxVisitas;

    } else {

      // Nunca superar a México
      if (p.visitas >= mexicoObj.visitas) {
        p.visitas = Math.max(1, mexicoObj.visitas - 1);
      }
    }
  });

  /* ----- Movimiento de países ----- */

  if (Math.random() < 0.6) {  // más dinámico pero creíble

    // Agregar país
    if (data.paises.length < nivel.maxPaises && Math.random() < 0.6) {

      const disponibles = paisesAmerica.filter(p =>
        p.nombre !== "México" &&
        !data.paises.find(x => x.nombre === p.nombre)
      );

      if (disponibles.length > 0) {
        const nuevo = disponibles[Math.floor(Math.random() * disponibles.length)];
        data.paises.push({
          ...nuevo,
          visitas: 1
        });
      }

    } 
    // Quitar país (nunca México)
    else if (data.paises.length > 1 && Math.random() < 0.3) {

      data.paises = data.paises.filter(p =>
        p.nombre === "México" || Math.random() > 0.5
      );
    }
  }

  localStorage.setItem("contadorSocial", JSON.stringify(data));
  mostrarContador();
}

/* -------- Mostrar -------- */

function mostrarContador() {
  const data = obtenerEstado();
  data.paises = data.paises.filter(p => p.visitas > 0);
  const contenedor = document.getElementById("lista-usuarios");
  contenedor.innerHTML = "";

  const mapaBanderas = {
    "México": "🇲🇽",
    "Guatemala": "🇬🇹",
    "Estados Unidos": "🇺🇸",
    "Colombia": "🇨🇴",
    "Argentina": "🇦🇷",
    "Chile": "🇨🇱",
    "Perú": "🇵🇪",
    "El Salvador": "🇸🇻"
  };

  data.paises
    .sort((a,b) => b.visitas - a.visitas)
    .forEach(p => {

      contenedor.innerHTML += `
        <div style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          padding:8px 12px;
          margin-bottom:6px;
          background:#f4f7ff;
          border-radius:10px;
        ">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:18px;">
              ${mapaBanderas[p.nombre] || ""}
            </span>
            <span style="font-weight:500;">
              ${p.nombre}
            </span>
          </div>

          <div style="
            font-weight:700;
            color:#0d47a1;
          ">
            ${p.visitas}
          </div>
        </div>
      `;
    });
}

/* -------- Inicializar -------- */

mostrarContador();
setInterval(actualizarEstado, 180000); // 3 minutos
</script>

      <polyline points="9 18 15 12 9 6"/>

</div>

<script>
// ── ORB CANVAS ──
(function() {
  const canvas = document.getElementById('silaba-orb-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const DPR = window.devicePixelRatio || 1;
  const W = 52, H = 52;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.scale(DPR, DPR);
  const cx = W/2, cy = H/2;
  const SIM = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789αβγδεζηθλμξπσφψωΩ§∞≈∑√∂∇♦★☆✦".split("");
  const part = Array.from({length:22},(_,i)=>({
    s:SIM[Math.floor(Math.random()*SIM.length)],
    a:(i/22)*Math.PI*2, r:17+Math.random()*7,
    v:(0.012+Math.random()*0.01)*(Math.random()>.5?1:-1),
    sz:5+Math.random()*4, op:.5+Math.random()*.5,
    ct:80+Math.floor(Math.random()*120),
  }));
  let sa=0,pt=0,ft=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    const pulse=1+Math.sin(pt)*0.07; pt+=0.03;
    const halo=ctx.createRadialGradient(cx,cy,4,cx,cy,22*pulse);
    halo.addColorStop(0,'rgba(180,220,255,0)');
    halo.addColorStop(.5,'rgba(0,201,177,.1)');
    halo.addColorStop(1,'rgba(0,100,180,0)');
    ctx.beginPath(); ctx.arc(cx,cy,22*pulse,0,Math.PI*2); ctx.fillStyle=halo; ctx.fill();
    for(let s=0;s<2;s++){
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(sa+Math.PI*s);
      ctx.beginPath();
      for(let i=0;i<80;i++){
        const a=(i/80)*Math.PI*2,r=(3+i*.12)*pulse;
        const x=Math.cos(a*2.5+sa*.5)*r,y=Math.sin(a*2.5+sa*.5)*r*.6;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`rgba(120,210,255,${.35-s*.1})`; ctx.lineWidth=.8; ctx.stroke(); ctx.restore();
    }
    const core=ctx.createRadialGradient(cx,cy,0,cx,cy,10*pulse);
    core.addColorStop(0,'rgba(255,255,255,.95)');
    core.addColorStop(.3,'rgba(200,240,255,.8)');
    core.addColorStop(.6,'rgba(0,201,177,.45)');
    core.addColorStop(1,'rgba(0,100,180,0)');
    ctx.beginPath(); ctx.arc(cx,cy,10*pulse,0,Math.PI*2); ctx.fillStyle=core; ctx.fill();
    for(let d=0;d<3;d++){
      const da=sa*1.8+(Math.PI*2/3)*d;
      const dx=cx+Math.cos(da)*5*pulse,dy=cy+Math.sin(da)*5*pulse;
      const dest=ctx.createRadialGradient(dx,dy,0,dx,dy,3);
      dest.addColorStop(0,'rgba(255,255,255,.9)'); dest.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath(); ctx.arc(dx,dy,3,0,Math.PI*2); ctx.fillStyle=dest; ctx.fill();
    }
    part.forEach(p=>{
      p.a+=p.v;
      if(ft%p.ct===0){p.s=SIM[Math.floor(Math.random()*SIM.length)];p.ct=80+Math.floor(Math.random()*120);}
      const x=cx+Math.cos(p.a)*p.r,y=cy+Math.sin(p.a)*p.r*.65;
      const dist=Math.sqrt((x-cx)**2+(y-cy)**2),fade=Math.min(1,dist/10);
      ctx.save(); ctx.font=`${p.sz}px monospace`;
      ctx.fillStyle=`rgba(${p.a%2<1?'0,201,177':'150,220,255'},${p.op*fade})`;
      ctx.shadowColor='rgba(0,201,177,.5)'; ctx.shadowBlur=4;
      ctx.fillText(p.s,x-p.sz/3,y+p.sz/3); ctx.restore();
    });
    sa+=0.018; ft++; requestAnimationFrame(draw);
  }
  draw();
})();
